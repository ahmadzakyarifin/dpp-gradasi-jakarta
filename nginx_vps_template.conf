# ==========================================
# CONTOH CONFIG NGINX UNTUK VPS PRODUCTION
# ==========================================

server {
    listen 80;
    server_name gradasi.id www.gradasi.id;

    # Folder build frontend React kamu
    root /var/www/gradasi/frontend/dist;
    index index.html;

    # 1. ATURAN SEO BOT (BERITA)
    location /berita/ {
        if ($http_user_agent ~* "WhatsApp|facebookexternalhit|Twitterbot|LinkedInBot|TelegramBot") {
            rewrite ^/berita/(.*)$ /api/v1/seo/berita/$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
        try_files $uri /index.html;
    }

    # 2. ATURAN SEO BOT (KEGIATAN)
    location /kegiatan/ {
        if ($http_user_agent ~* "WhatsApp|facebookexternalhit|Twitterbot|LinkedInBot|TelegramBot") {
            rewrite ^/kegiatan/(.*)$ /api/v1/seo/kegiatan/$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
        try_files $uri /index.html;
    }

    # 3. ATURAN API BACKEND
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. ATURAN UPLOADS (GAMBAR BACKEND)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # 5. ATURAN DEFAULT REACT (SPA)
    location / {
        try_files $uri /index.html;
    }
}
