    searchQuery: '',
    // Filter state (nilai = persis contract activity_logs.jsonc)
    filterAdmin: '',
    filterEntity: '',
    filterRisk: '',
    applyFilter() { this.currentPage = 1; },
    resetFilter() {
        this.searchQuery = '';
        this.filterAdmin = '';
        this.filterEntity = '';
        this.filterRisk = '';
        this.currentPage = 1;
    },
    currentPage: 1,
    pageSize: 5,
    get totalPages() { return Math.ceil(this.allData.length / this.pageSize) || 1; },
    get paginatedItems() {
        let items = this.allData.filter(log => {
            if (this.searchQuery) {
                let q = this.searchQuery.toLowerCase();
                if (!log.actorName.toLowerCase().includes(q) &&
                    !log.action.toLowerCase().includes(q) &&
                    !log.entityLabel.toLowerCase().includes(q)) {
                    return false;
                }
            }
            if (this.filterAdmin && log.actorName !== this.filterAdmin) return false;
            if (this.filterEntity && log.entityType !== this.filterEntity) return false;
            if (this.filterRisk && log.riskLevel !== this.filterRisk) return false;
            return true;
        });
        const start = (this.currentPage - 1) * this.pageSize;
        return items.slice(start, start + this.pageSize);
    },
    nextPage() { if (this.currentPage < this.totalPages) this.currentPage++; },
    prevPage() { if (this.currentPage > 1) this.currentPage--; },
    goToPage(p) { this.currentPage = p; }
}">

                                                    </div>

                                                        <span x-text="log.actorRole"></span> • <span class="font-mono text-gray-400" x-text="log.ipAddress"></span>
                                                    </div>
                                                    <div class="text-[10px] text-gray-400 mt-1 leading-tight max-w-[200px]" x-text="log.userAgent" title="User Agent"></div>
                                                </div>
                                            </div>
                                        </td>

                                                    :class="{
                                                        'bg-red-50 text-red-600 border-red-200': log.action.includes('delete'),
                                                        'bg-emerald-50 text-emerald-600 border-emerald-200': log.action.includes('restore') || log.action.includes('create'),
                                                        'bg-blue-50 text-blue-600 border-blue-200': log.action.includes('update') || log.action.includes('login')
                                                    }" x-text="log.action"></span>
                                                
                                                <div class="bg-gray-100 border border-gray-200 px-2 py-1 rounded text-xs w-full max-w-[220px]">
                                                    <span class="text-gray-500 font-medium capitalize" x-text="log.entityType"></span> 
                                                    <span x-show="log.entityId" class="text-gray-400">#<span x-text="log.entityId"></span></span>
                                                    <div class="font-medium text-gray-800 mt-0.5 truncate" x-text="log.entityLabel" :title="log.entityLabel"></div>
                                                </div>
                                            </div>
                                        </td>
                                        
                                        <!-- RISIKO -->
                                        <td class="p-4">
                                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border"
                                                :class="{
                                                    'bg-red-50 text-red-700 border-red-200': log.riskLevel === 'high',
                                                    'bg-amber-50 text-amber-700 border-amber-200': log.riskLevel === 'medium',
                                                    'bg-emerald-50 text-emerald-700 border-emerald-200': log.riskLevel === 'low'
                                                }">
                                                <i class="ph" :class="{
                                                    'ph-warning-circle': log.riskLevel === 'high',
                                                    'ph-info': log.riskLevel === 'low' || log.riskLevel === 'medium'
                                                }"></i>
                                                <span x-text="log.riskLevel.charAt(0).toUpperCase() + log.riskLevel.slice(1)"></span>
                                            </span>
                                        </td>

                                    </tr>

                        </table>
