<!DOCTYPE html>
<html lang="id" class="bg-gray-50 text-gray-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Admin DPP GRADASI</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="font-sans antialiased overflow-hidden flex h-screen" >

    <!-- Sidebar -->
    <aside class="w-64 bg-brand-900 text-white flex flex-col h-full shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-white/10">
            <span class="font-heading font-bold text-xl tracking-wide">GRADASI<span class="text-brand-400">Admin</span></span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-3">
            <a href="index.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-squares-four text-xl mr-3"></i> Dashboard
            </a>
            <a href="berita.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-article text-xl mr-3"></i> Berita
            </a>
            <a href="kegiatan.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-calendar-check text-xl mr-3"></i> Kegiatan
            </a>
            <a href="pengurus.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-users-three text-xl mr-3"></i> Pengurus
            </a>
            <a href="sliders.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-image text-xl mr-3"></i> Sliders
            </a>
            <a href="kontak.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-envelope-simple text-xl mr-3"></i> Pesan Kontak
            </a>
            <a href="users.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-user-gear text-xl mr-3"></i> Manajemen Admin
            </a>
            <a href="activity-log.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-clock-counter-clockwise text-xl mr-3"></i> Activity Log
            </a>
            <a href="settings.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-gear text-xl mr-3"></i> Pengaturan Website
            </a>
        </nav>
        <div class="p-4 border-t border-white/10">
            <a href="../login.html" class="flex items-center px-3 py-2 rounded-lg text-red-300 hover:bg-red-500/20 transition-colors">
                <i class="ph ph-sign-out text-xl mr-3"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <h1 class="font-heading font-semibold text-gray-800 text-lg">Profil Saya</h1>
            <div class="flex items-center gap-4">
                <div class="relative" x-data="{ userMenuOpen: false }" @click.away="userMenuOpen = false">
                    <button @click="userMenuOpen = !userMenuOpen" class="flex items-center gap-2 hover:bg-gray-100 p-2 rounded-lg transition">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" class="w-8 h-8 rounded-full" alt="Admin" id="headerProfileImg">
                        <span class="text-sm font-medium text-gray-700" id="headerProfileName">Admin</span>
                        <i class="ph ph-caret-down text-gray-500"></i>
                    </button>
                    <div x-show="userMenuOpen" x-transition 
                         class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50"
                         style="display: none;">
                        <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-brand-600">
                            <i class="ph ph-user-circle mr-2"></i> Profil Saya
                        </a>
                        <div class="border-t border-gray-100 my-1"></div>
                        <a href="../login.html" onclick="localStorage.removeItem('access_token')" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                            <i class="ph ph-sign-out mr-2"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-8">
            <div class="max-w-4xl mx-auto space-y-6" x-data="profileData()">
                
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-200">
                        <h2 class="text-lg font-semibold text-gray-800">Informasi Pribadi</h2>
                        <p class="text-sm text-gray-500">Perbarui nama, email, dan foto profil Anda.</p>
                    </div>
                    <div class="p-6">
                        <form @submit.prevent="updateProfile">
                            <div class="flex items-center gap-6 mb-6">
                                <img :src="formData.photo_preview || 'https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff'" class="w-20 h-20 rounded-full object-cover border border-gray-200" alt="Foto">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Foto Profil</label>
                                    <input type="file" @change="handleFileChange" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                                    <input type="text" x-model="formData.name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Email</label>
                                    <input type="email" x-model="formData.email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                                </div>
                            </div>
                            <div class="flex justify-end">
                                <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition shadow-sm text-sm font-medium" :disabled="loading">
                                    <span x-show="!loading">Simpan Perubahan</span>
                                    <span x-show="loading">Menyimpan...</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-200">
                        <h2 class="text-lg font-semibold text-gray-800">Ubah Password</h2>
                        <p class="text-sm text-gray-500">Pastikan akun Anda aman dengan password yang kuat.</p>
                    </div>
                    <div class="p-6">
                        <form @submit.prevent="updatePassword">
                            <div class="space-y-4 mb-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Password Lama</label>
                                    <input type="password" x-model="passwordData.old_password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Password Baru</label>
                                    <input type="password" x-model="passwordData.new_password" required minlength="6" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                                </div>
                            </div>
                            <div class="flex justify-end">
                                <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition shadow-sm text-sm font-medium" :disabled="loadingPwd">
                                    <span x-show="!loadingPwd">Ubah Password</span>
                                    <span x-show="loadingPwd">Memproses...</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('profileData', () => ({
                formData: { name: '', email: '', photo: null, photo_preview: '' },
                passwordData: { old_password: '', new_password: '' },
                loading: false,
                loadingPwd: false,
                
                init() {
                    this.fetchProfile();
                },
                
                fetchProfile() {
                    const token = localStorage.getItem('access_token');
                    if (!token) return window.location.href = '../login.html';
                    
                    fetch('http://127.0.0.1:8080/api/v1/profile', {
                        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
                    })
                    .then(r => r.json())
                    .then(res => {
                        if (res.success && res.data) {
                            this.formData.name = res.data.name;
                            this.formData.email = res.data.email;
                            this.formData.photo_preview = res.data.photo_path ? ('http://127.0.0.1:8080' + res.data.photo_path) : '';
                            
                            // Update header info as well
                            document.getElementById('headerProfileName').innerText = res.data.name;
                            if (res.data.photo_path) {
                                document.getElementById('headerProfileImg').src = 'http://127.0.0.1:8080' + res.data.photo_path;
                            }
                        }
                    });
                },
                
                handleFileChange(e) {
                    const file = e.target.files[0];
                    if (file) {
                        this.formData.photo = file;
                        this.formData.photo_preview = URL.createObjectURL(file);
                    }
                },
                
                updateProfile() {
                    this.loading = true;
                    const token = localStorage.getItem('access_token');
                    const fd = new FormData();
                    fd.append('name', this.formData.name);
                    fd.append('email', this.formData.email);
                    if (this.formData.photo) fd.append('photo', this.formData.photo);
                    
                    fetch('http://127.0.0.1:8080/api/v1/profile', {
                        method: 'PUT',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: fd
                    })
                    .then(r => r.json())
                    .then(res => {
                        this.loading = false;
                        if (res.success) {
                            alert(res.message || 'Profil berhasil diperbarui');
                            this.fetchProfile();
                        } else {
                            alert('Gagal: ' + res.message);
                        }
                    })
                    .catch(() => { this.loading = false; alert('Terjadi kesalahan'); });
                },
                
                updatePassword() {
                    this.loadingPwd = true;
                    const token = localStorage.getItem('access_token');
                    fetch('http://127.0.0.1:8080/api/v1/profile/password', {
                        method: 'PUT',
                        headers: { 
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(this.passwordData)
                    })
                    .then(r => r.json())
                    .then(res => {
                        this.loadingPwd = false;
                        if (res.success) {
                            alert('Password berhasil diubah');
                            this.passwordData = { old_password: '', new_password: '' };
                        } else {
                            alert('Gagal: ' + res.message);
                        }
                    })
                    .catch(() => { this.loadingPwd = false; alert('Terjadi kesalahan'); });
                }
            }));
        });
    </script>

</body>
</html>
