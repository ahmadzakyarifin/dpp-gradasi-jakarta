<!DOCTYPE html>
<html lang="id" class="bg-gray-50 text-gray-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Berita - Admin DPP GRADASI</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="font-sans antialiased overflow-hidden flex h-screen" x-data="adminData()">

    <!-- Sidebar -->
    <aside class="w-64 bg-brand-900 text-white flex flex-col h-full shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-white/10">
            <span class="font-heading font-bold text-xl tracking-wide">GRADASI<span class="text-brand-400">Admin</span></span>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-3">
            <a href="index.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-squares-four text-xl mr-3"></i> Dashboard
            </a>
            <a href="berita.html" class="flex items-center px-3 py-2.5 rounded-lg bg-brand-600 text-white shadow-sm transition-colors">
                <i class="ph ph-article text-xl mr-3"></i> Berita
            </a>
            <a href="kegiatan.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-calendar-check text-xl mr-3"></i> Kegiatan
            </a>
            <a href="pengurus.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-users-three text-xl mr-3"></i> Pengurus
            </a>
            <a href="sliders.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-image text-xl mr-3"></i> Sliders
            </a>
            <a href="kontak.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-envelope-simple text-xl mr-3"></i> Pesan Kontak
            </a>
            <a href="users.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-user-gear text-xl mr-3"></i> Manajemen Admin
            </a>
            <a href="activity-log.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-clock-counter-clockwise text-xl mr-3"></i> Activity Log
            </a>
            <a href="settings.html" class="flex items-center px-3 py-2.5 rounded-lg text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="ph ph-gear text-xl mr-3"></i> Pengaturan Website
            </a>
        </nav>
        <div class="p-4 border-t border-white/10">
            <a href="../login.html" class="flex items-center px-3 py-2 rounded-lg text-red-300 hover:bg-red-500/20 transition-colors">
                <i class="ph ph-sign-out text-xl mr-3"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <h1 class="font-heading font-semibold text-gray-800 text-lg">Manajemen Berita</h1>
            
            <!-- Center Actions -->
            <div class="flex-1 flex items-center justify-center px-6">
                <div class="flex items-center gap-2 w-full max-w-2xl">
                    <!-- Search -->
                    <div class="relative w-full">
                        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" x-model="searchQuery" placeholder="Cari berita..." class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-colors">
                    </div>
                    <!-- Filter: Status -->
                    <select x-model="filterStatus" class="shrink-0 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-colors">
                        <option value="">Semua Status</option>
                        <option value="published">Public</option>
                        <option value="draft">Draft</option>
                    </select>
                    <!-- Filter: Urutan -->
                    <select x-model="filterSort" class="shrink-0 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-colors">
                        <option value="newest">Terbaru</option>
                        <option value="oldest">Terlama</option>
                    </select>
                    <!-- Reset Button -->
                    <button @click="resetFilter()" class="shrink-0 bg-gray-50 border border-gray-200 text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                        <i class="ph ph-arrows-counter-clockwise text-lg"></i> Reset
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative" x-data="{ userMenuOpen: false }" @click.away="userMenuOpen = false">
                    <button @click="userMenuOpen = !userMenuOpen" class="flex items-center gap-2 hover:bg-gray-100 p-2 rounded-lg transition">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" class="w-8 h-8 rounded-full" alt="Admin" id="headerProfileImg">
                        <span class="text-sm font-medium text-gray-700" id="headerProfileName">Admin</span>
                        <i class="ph ph-caret-down text-gray-500"></i>
                    </button>
                    <div x-show="userMenuOpen" x-transition 
                         class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50"
                         style="display: none;">
                        <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-brand-600">
                            <i class="ph ph-user-circle mr-2"></i> Profil Saya
                        </a>
                        <div class="border-t border-gray-100 my-1"></div>
                        <a href="../login.html" onclick="localStorage.removeItem('access_token')" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                            <i class="ph ph-sign-out mr-2"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-auto p-8">
            <div class="max-w-7xl mx-auto space-y-6">

                <!-- Header Actions -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <!-- Tabs -->
                    <div class="flex bg-white rounded-lg p-1 border border-gray-200 shadow-sm">
                        <button @click="currentTab = 'active'" :class="{'bg-brand-50 text-brand-600 shadow-sm font-medium': currentTab === 'active', 'text-gray-500 hover:text-gray-700': currentTab !== 'active'}" class="px-4 py-1.5 rounded-md text-sm transition-all">Aktif & Draft</button>
                        <button @click="currentTab = 'trash'" :class="{'bg-red-50 text-red-600 shadow-sm font-medium': currentTab === 'trash', 'text-gray-500 hover:text-gray-700': currentTab !== 'trash'}" class="px-4 py-1.5 rounded-md text-sm transition-all flex items-center gap-2">
                            <i class="ph ph-trash"></i> Sampah (History)
                        </button>
                    </div>

                    <!-- Right Actions -->
                    <div class="flex items-center gap-2 w-full sm:w-auto flex-wrap sm:flex-nowrap">
                        <button x-show="currentTab === 'active'" @click="openFormModal()" class="shrink-0 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors shadow-sm">
                            <i class="ph ph-plus-circle text-lg"></i> Tambah
                        </button>
                    </div>
                </div>

                <!-- Bulk Actions Bar (Shows when items selected) -->
                <div x-show="selectedItems.length > 0" x-transition class="bg-indigo-50 border border-indigo-100 rounded-lg p-3 flex items-center justify-between shadow-sm">
                    <span class="text-sm text-indigo-800 font-medium"><span x-text="selectedItems.length"></span> item terpilih</span>
                    <div class="flex gap-2">
                        <template x-if="currentTab === 'active'">
                            <button @click="confirmAction('bulk_delete')" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-colors">
                                <i class="ph ph-trash"></i> Hapus Massal
                            </button>
                        </template>
                        <template x-if="currentTab === 'trash'">
                            <div class="flex gap-2">
                                <button @click="confirmAction('bulk_restore')" class="bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-colors">
                                    <i class="ph ph-arrow-counter-clockwise"></i> Pulihkan Massal
                                </button>
                                
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200 text-xs uppercase tracking-wider text-gray-500 font-semibold">
                                    <th class="p-4 w-12 text-center">
                                        <input type="checkbox" @change="toggleAll" :checked="isAllSelected" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                    </th>
                                    <th class="p-4">Judul & Kategori</th>
                                    <th class="p-4">Tanggal</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm text-gray-700">
                                <!-- Data rows -->
                                <template x-for="item in paginatedItems" :key="item.id">
                                    <tr class="hover:bg-gray-50 transition-colors group">
                                        <td class="p-4 text-center">
                                            <input type="checkbox" :value="item.id" x-model="selectedItems" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                        </td>
                                        <td class="p-4">
                                            <div class="flex items-start gap-3">
                                                <img :src="item.image" class="w-16 h-12 rounded object-cover border border-gray-200 shrink-0" alt="">
                                                <div>
                                                    <p class="font-medium text-gray-900 leading-snug" x-text="item.title"></p>
                                                    <div class="flex items-center gap-2 mt-1">
                                                        <span class="inline-block bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-full" x-text="item.category"></span>
                                                        <span class="text-xs text-gray-400"><i class="ph ph-eye"></i> <span x-text="item.views"></span></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="p-4 text-gray-500" x-text="item.date"></td>
                                        
                                        <!-- Status Column -->
                                        <td class="p-4">
                                            <template x-if="currentTab === 'active'">
                                                <label class="relative inline-flex items-center cursor-pointer" @click.prevent="confirmAction('toggle_publish', item.id, item.isPublished)">
                                                    <input type="checkbox" class="sr-only peer" :checked="item.isPublished">
                                                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand-500"></div>
                                                    <span class="ml-2 text-xs font-medium" :class="item.isPublished ? 'text-brand-600' : 'text-gray-400'" x-text="item.isPublished ? 'Published' : 'Draft'"></span>
                                                </label>
                                            </template>
                                            <template x-if="currentTab === 'trash'">
                                                <span class="inline-flex items-center gap-1 bg-red-50 text-red-600 text-xs px-2 py-1 rounded-md font-medium border border-red-100">
                                                    <i class="ph ph-trash"></i> Terhapus
                                                </span>
                                            </template>
                                        </td>

                                        <!-- Action Column -->
                                        <td class="p-4 text-right">
                                            <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <template x-if="currentTab === 'active'">
                                                    <div class="flex gap-2">
                                                        <button @click="openFormModal(item)" class="p-1.5 text-gray-500 hover:text-brand-600 hover:bg-brand-50 rounded" title="Edit">
                                                            <i class="ph ph-pencil-simple text-lg"></i>
                                                        </button>
                                                        <button @click="copyLink(item.id, 'berita')" class="p-1.5 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded" title="Salin Tautan">
                                                            <i class="ph ph-link text-lg"></i>
                                                        </button>
                                                        <button @click="confirmAction('delete', item.id)" class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded" title="Hapus (Soft Delete)">
                                                            <i class="ph ph-trash text-lg"></i>
                                                        </button>
                                                    </div>
                                                </template>
                                                <template x-if="currentTab === 'trash'">
                                                    <div class="flex gap-2">
                                                        <button @click="confirmAction('restore', item.id)" class="p-1.5 text-gray-500 hover:text-emerald-600 hover:bg-emerald-50 rounded" title="Pulihkan">
                                                            <i class="ph ph-arrow-counter-clockwise text-lg"></i>
                                                        </button>
                                                        
                                                    </div>
                                                </template>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div x-show="filteredItems.length === 0" class="py-12 text-center">
                            <i class="ph ph-folder-open text-4xl text-gray-300 mb-2"></i>
                            <p class="text-gray-500 text-sm">Tidak ada data untuk ditampilkan.</p>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div x-show="filteredItems.length > 0" class="bg-gray-50 border-t border-gray-200 px-4 py-3 flex items-center justify-between sm:px-6 rounded-b-xl">
                        <div class="text-sm text-gray-500">
                            Menampilkan <span class="font-medium text-gray-900" x-text="(currentPage - 1) * pageSize + 1"></span> sampai <span class="font-medium text-gray-900" x-text="Math.min(currentPage * pageSize, filteredItems.length)"></span> dari <span class="font-medium text-gray-900" x-text="filteredItems.length"></span> hasil
                        </div>
                        <div class="flex gap-1">
                            <button @click="prevPage" :disabled="currentPage === 1" class="px-3 py-1 border border-gray-200 bg-white text-gray-500 rounded hover:bg-gray-50 disabled:opacity-50">Prev</button>
                            
                            <template x-for="p in totalPages" :key="p">
                                <button @click="goToPage(p)" class="px-3 py-1 border rounded" :class="currentPage === p ? 'border-brand-500 bg-brand-50 text-brand-600 font-medium' : 'border-gray-200 bg-white text-gray-500 hover:bg-gray-50'" x-text="p"></button>
                            </template>

                            <button @click="nextPage" :disabled="currentPage === totalPages" class="px-3 py-1 border border-gray-200 bg-white text-gray-500 rounded hover:bg-gray-50 disabled:opacity-50">Next</button>
                        </div>
                    </div>
                    
                    </div>
</div>

            </div>
        </div>
    </main>

    <!-- FORM MODAL (Create/Edit) -->
    <div x-show="isFormOpen" style="display: none;" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="isFormOpen" x-transition.opacity class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="isFormOpen = false"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div x-show="isFormOpen" x-transition.translate.y class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-3xl sm:w-full">
                <div class="bg-white">
                    <div class="border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                        <h3 class="text-lg leading-6 font-heading font-semibold text-gray-900" id="modal-title" x-text="formMode === 'create' ? 'Tambah Berita' : 'Edit Berita'"></h3>
                        <button @click="isFormOpen = false" class="text-gray-400 hover:text-gray-500"><i class="ph ph-x text-xl"></i></button>
                    </div>
                    <form @submit.prevent="submitForm" class="px-6 py-4 space-y-5 h-[60vh] overflow-y-auto">
                        <!-- Consolidated Inputs -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Judul Berita *</label>
                                <input type="text" x-model="formData.title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Kategori *</label>
                                <select x-model="formData.category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm bg-white">
                                    <option value="Berita Nasional">Berita Nasional</option>
                                    <option value="Berita Daerah">Berita Daerah</option>
                                    <option value="Berita Organisasi">Berita Organisasi</option>
                                    <option value="Berita Pendidikan">Berita Pendidikan</option>
                                    <option value="Berita Kebijakan">Berita Kebijakan</option>
                                    <option value="Teknologi">Teknologi</option>
                                    <option value="Edukasi">Edukasi</option>
                                    <option value="Event">Event</option>
                                    <option value="Tips & Trik">Tips & Trik</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Penulis *</label>
                                <input type="text" x-model="formData.author" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Buat *</label>
                                <input type="date" x-model="formData.date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tags (pisahkan dengan koma)</label>
                                <input type="text" x-model="formData.tags" placeholder="digital, indonesia, gradasi" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Gambar Utama (URL) *</label>
                                <input type="url" x-model="formData.image" required placeholder="https://example.com/image.jpg" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm">
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Kutipan Singkat (Excerpt)</label>
                                <textarea x-model="formData.excerpt" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm"></textarea>
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Konten Lengkap *</label>
                                <textarea x-model="formData.content" required rows="6" placeholder="Format HTML atau teks..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 text-sm font-mono"></textarea>
                            </div>
                            
                            <div class="md:col-span-2">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" x-model="formData.isPublished" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                    <span class="text-sm font-medium text-gray-700">Langsung Terbitkan (Publish)</span>
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                    <button type="button" @click="isFormOpen = false" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Batal</button>
                    <button type="button" @click="submitForm" class="px-4 py-2 bg-brand-600 border border-transparent rounded-lg text-sm font-medium text-white hover:bg-brand-700">Simpan Data</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONFIRMATION MODAL -->
    <div x-show="confirm.isOpen" style="display: none;" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="confirm.isOpen" x-transition.opacity class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="confirm.isOpen = false"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div x-show="confirm.isOpen" x-transition.translate.y class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-sm sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full sm:mx-0 sm:h-10 sm:w-10"
                            :class="confirm.type.includes('delete') ? 'bg-red-100 text-red-600' : (confirm.type.includes('restore') ? 'bg-emerald-100 text-emerald-600' : 'bg-brand-100 text-brand-600')">
                            <i class="text-2xl" :class="confirm.icon"></i>
                        </div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title" x-text="confirm.title"></h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500" x-text="confirm.message"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 flex justify-end gap-2">
                    <button type="button" @click="confirm.isOpen = false" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Batal
                    </button>
                    <button type="button" @click="executeAction" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 text-base font-medium text-white focus:outline-none sm:w-auto sm:text-sm"
                        :class="confirm.type.includes('delete') ? 'bg-red-600 hover:bg-red-700' : (confirm.type.includes('restore') ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-brand-600 hover:bg-brand-700')">
                        Ya, Lanjutkan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div x-show="toast.show" x-transition.opacity.duration.300ms style="display: none;" class="fixed bottom-4 right-4 z-50 flex items-center p-4 rounded-lg shadow-lg" :class="toast.type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'">
        <i class="text-xl mr-2" :class="toast.type === 'success' ? 'ph ph-check-circle' : 'ph ph-warning-circle'"></i>
        <span x-text="toast.message" class="text-sm font-medium"></span>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('adminData', () => ({
                currentTab: 'active',
                currentPage: 1,
                pageSize: 5,

                searchQuery: '',
                // Filter state
                filterStatus: '',
                filterSort: 'newest',
                applyFilter() { this.currentPage = 1; },
                resetFilter() {
                    this.searchQuery = '';
                    this.filterStatus = '';
                    this.filterSort = 'newest';
                    this.currentPage = 1;
                    this.showToast('Filter direset.', 'success');
                },

                get totalPages() {
                    return Math.ceil(this.filteredItems.length / this.pageSize) || 1;
                },

                get paginatedItems() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.filteredItems.slice(start, start + this.pageSize);
                },

                nextPage() {
                    if (this.currentPage < this.totalPages) this.currentPage++;
                },

                prevPage() {
                    if (this.currentPage > 1) this.currentPage--;
                },
                
                goToPage(p) {
                    this.currentPage = p;
                },
 // active, trash
                selectedItems: [],
                
                // MOCK DATA
                allData: [
                    { id: 1, title: 'Peluncuran Program Literasi Digital Nasional 2026', category: 'Nasional', image: 'https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?auto=format&fit=crop&q=80&w=200', views: 1250, isPublished: true, date: '2026-07-28', status: 'active', excerpt: 'Pemerintah secara resmi meluncurkan program literasi digital skala nasional untuk meningkatkan kompetensi masyarakat...' },
                    { id: 2, title: 'Pelatihan UMKM Go Digital di Jawa Barat', category: 'Daerah', image: 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80&w=200', views: 890, isPublished: true, date: '2026-07-25', status: 'active', excerpt: 'Ratusan pelaku UMKM di Jawa Barat mengikuti pelatihan intensif mengenai strategi pemasaran digital...' },
                    { id: 3, title: 'Rapat Kerja Nasional (Rakernas) GRADASI 2026', category: 'Berita Organisasi', image: 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&q=80&w=200', views: 450, isPublished: true, date: '2026-07-20', status: 'active', excerpt: 'Rakernas tahun ini fokus pada penyelarasan program kerja di seluruh DPD di Indonesia...' },
                    { id: 4, title: 'Kunjungan Kerja ke Kementerian Kominfo', category: 'Berita Organisasi', image: 'https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=200', views: 320, isPublished: true, date: '2026-07-15', status: 'active', excerpt: 'Pengurus pusat melakukan audiensi terkait kolaborasi program startup digital...' },
                    { id: 5, title: 'Workshop Cyber Security untuk Pelajar', category: 'Edukasi', image: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=200', views: 0, isPublished: false, date: '2026-07-30', status: 'active', excerpt: 'Draft materi untuk publikasi kegiatan workshop minggu depan...' },
                    { id: 6, title: 'Perkembangan AI di Dunia Pendidikan', category: 'Teknologi', image: 'https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&q=80&w=200', views: 215, isPublished: true, date: '2026-07-10', status: 'active', excerpt: 'Kecerdasan buatan semakin merambah dunia pendidikan dengan munculnya berbagai asisten belajar pintar...' },
                    { id: 7, title: 'Seminar Nasional Membangun Startup Edukasi', category: 'Event', image: 'https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&q=80&w=200', views: 540, isPublished: true, date: '2026-07-05', status: 'active', excerpt: 'Mengulas potensi dan tantangan membangun edutech di Indonesia bersama pakar...' },
                    { id: 8, title: 'Tips Menghindari Penipuan Online (Phishing)', category: 'Tips & Trik', image: 'https://images.unsplash.com/photo-1563206767-5b18f218e8de?auto=format&fit=crop&q=80&w=200', views: 1100, isPublished: true, date: '2026-06-28', status: 'active', excerpt: 'Kenali ciri-ciri tautan berbahaya dan amankan akun digital Anda dari serangan siber...' },
                    { id: 9, title: 'Kompetisi Hackathon Pemuda 2026', category: 'Event', image: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&q=80&w=200', views: 76, isPublished: false, date: '2026-05-12', status: 'trash', excerpt: 'Kompetisi ini telah berakhir dan dokumentasinya sudah diarsipkan...' },
                    { id: 10, title: 'Panduan Menggunakan Aplikasi Keuangan Digital', category: 'Edukasi', image: 'https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&q=80&w=200', views: 24, isPublished: false, date: '2026-04-10', status: 'trash', excerpt: 'Dibatalkan karena format penulisan tidak sesuai standar redaksi...' }
                ],

                get filteredItems() {
                    let result = this.allData.filter(item => {
                        let ok = true;
                        if (this.currentTab === 'active') ok = item.status === 'active';
                        else if (this.currentTab === 'trash') ok = item.status === 'trash';

                        if (ok && this.searchQuery) {
                            ok = item.title.toLowerCase().includes(this.searchQuery.toLowerCase());
                        }

                        // Filter status
                        if (ok && this.filterStatus) {
                            if (this.filterStatus === 'published' && !item.isPublished) ok = false;
                            if (this.filterStatus === 'draft' && item.isPublished) ok = false;
                        }
                        return ok;
                    });

                    if (this.filterSort === 'newest') result.sort((a,b) => new Date(b.date) - new Date(a.date));
                    else if (this.filterSort === 'oldest') result.sort((a,b) => new Date(a.date) - new Date(b.date));
                    else if (this.filterSort === 'most_viewed') result.sort((a,b) => b.views - a.views);

                    return result;
                },

                get isAllSelected() {
                    const filtered = this.filteredItems;
                    return filtered.length > 0 && this.selectedItems.length === filtered.length;
                },

                toggleAll() {
                    if (this.isAllSelected) {
                        this.selectedItems = [];
                    } else {
                        this.selectedItems = this.filteredItems.map(item => item.id);
                    }
                },

                // Watcher untuk tab change
                init() {
                    this.$watch('currentTab', value => {
                        this.currentPage = 1;
                        this.selectedItems = [];
                    });
                },

                // Form Modal
                isFormOpen: false,
                formMode: 'create', // create, edit
                formData: { id: null, title: '', category: 'Berita Nasional', author: 'Super Admin', date: '', image: '', excerpt: '', content: '', tags: '', isPublished: true },
                
                openFormModal(item = null) {
                    if (item) {
                        this.formMode = 'edit';
                        this.formData = { ...item, excerpt: item.excerpt || '', content: item.content || 'Konten detail HTML...', tags: item.tags || 'gradasi, digital', author: item.author || 'Super Admin', date: item.date || new Date().toISOString().slice(0, 10) };
                    } else {
                        this.formMode = 'create';
                        this.formData = { id: null, title: '', category: 'Berita Nasional', author: 'Super Admin', date: new Date().toISOString().slice(0, 10), image: '', excerpt: '', content: '', tags: '', isPublished: true };
                    }
                    this.isFormOpen = true;
                },

                submitForm() {
                    // Sinkron: simpan data berita baru/update ke daftar (bukan MOCK SAVE saja)
                    if (this.formMode === 'create') {
                        this.formData.id = Date.now();
                        this.formData.status = 'active';
                        this.formData.views = 0;
                        if (!this.formData.date) this.formData.date = new Date().toISOString().slice(0, 10);
                        this.formData.isPublished = this.formData.isPublished !== false;
                        this.allData.push({ ...this.formData });
                    } else {
                        const idx = this.allData.findIndex(i => i.id === this.formData.id);
                        if (idx !== -1) this.allData[idx] = { ...this.formData };
                    }
                    this.isFormOpen = false;
                    this.showToast('Data berhasil disimpan!', 'success');
                },

                // Confirm Modal
                confirm: {
                    isOpen: false, type: '', id: null, title: '', message: '', icon: '', actionData: null
                },

                confirmAction(type, id = null, extraData = null) {
                    this.confirm.type = type;
                    this.confirm.id = id;
                    this.confirm.actionData = extraData;
                    
                    if (type === 'delete') {
                        this.confirm.title = 'Hapus Berita';
                        this.confirm.message = 'Berita ini akan dipindahkan ke Sampah (History). Anda masih bisa memulihkannya nanti.';
                        this.confirm.icon = 'ph-trash';
                    } else if (type === 'restore') {
                        this.confirm.title = 'Pulihkan Berita';
                        this.confirm.message = 'Berita ini akan dikembalikan ke daftar aktif.';
                        this.confirm.icon = 'ph-arrow-counter-clockwise';
                    } else if (type === 'toggle_publish') {
                        let willPublish = !extraData;
                        this.confirm.title = willPublish ? 'Terbitkan Berita' : 'Jadikan Draft';
                        this.confirm.message = willPublish ? 'Berita ini akan bisa dilihat oleh publik di website. Lanjutkan?' : 'Berita ini akan ditarik dari publik dan diubah menjadi draft. Lanjutkan?';
                        this.confirm.icon = willPublish ? 'ph-paper-plane-right' : 'ph-archive-box';
                    } else if (type === 'bulk_delete') {
                        this.confirm.title = 'Hapus Massal';
                        this.confirm.message = `Anda akan memindahkan ${this.selectedItems.length} item ke Sampah. Lanjutkan?`;
                        this.confirm.icon = 'ph-trash';
                    } else if (type === 'bulk_restore') {
                        this.confirm.title = 'Pulihkan Massal';
                        this.confirm.message = `Anda akan memulihkan ${this.selectedItems.length} item kembali ke daftar aktif. Lanjutkan?`;
                        this.confirm.icon = 'ph-arrow-counter-clockwise';
                    }
                    
                    this.confirm.isOpen = true;
                },

                executeAction() {
                    // MOCK EXECUTION
                    this.confirm.isOpen = false;
                    
                    if (this.confirm.type === 'toggle_publish') {
                        let item = this.allData.find(i => i.id === this.confirm.id);
                        if (item) item.isPublished = !item.isPublished;
                        this.showToast('Status berhasil diubah.', 'success');
                    } else if (this.confirm.type.includes('delete') || this.confirm.type.includes('restore')) {
                        // Mock UI updates
                        if (this.confirm.type === 'delete') {
                            let item = this.allData.find(i => i.id === this.confirm.id);
                            if (item) item.status = 'trash';
                        } else if (this.confirm.type === 'restore') {
                            let item = this.allData.find(i => i.id === this.confirm.id);
                            if (item) item.status = 'active';
                        } else if (this.confirm.type === 'bulk_delete') {
                            this.allData.forEach(item => {
                                if (this.selectedItems.includes(item.id)) item.status = 'trash';
                            });
                            this.selectedItems = [];
                        } else if (this.confirm.type === 'bulk_restore') {
                            this.allData.forEach(item => {
                                if (this.selectedItems.includes(item.id)) item.status = 'active';
                            });
                            this.selectedItems = [];
                        }
                        this.showToast('Aksi berhasil dilakukan.', 'success');
                    }
                },

                // Toast
                toast: { show: false, message: '', type: 'success' },
                showToast(message, type = 'success') {
                    this.toast.message = message;
                    this.toast.type = type;
                    this.toast.show = true;
                    setTimeout(() => this.toast.show = false, 3000);
                },

                copyLink(id, type) {
                    const url = window.location.origin + `/detail-${type}.html?id=${id}`;
                    navigator.clipboard.writeText(url).then(() => {
                        this.showToast('Tautan berhasil disalin!', 'success');
                    }).catch(() => {
                        this.showToast('Gagal menyalin tautan.', 'error');
                    });
                }
            }));
        });
    </script>
</body>
</html>
