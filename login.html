<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk / Daftar - DPP GRADASI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554',
                        }
                    },
                    backgroundImage: {
                        'texture-dots': "url(\"data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3Cg/%3E%3C/svg%3E\")",
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <style>
        /* Sembunyikan scrollbar tapi biarkan bisa discroll (jika layar sangat kecil) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="font-sans antialiased bg-white hide-scrollbar" x-data="{ 
    view: 'login', // 'login', 'register', 'forgot'
    login: { email: '', password: '' },
    loginTouched: { email: false, password: false },
    loginErrors: {},
    
    register: { name: '', email: '', password: '' },
    registerTouched: { name: false, email: false, password: false },
    registerErrors: {},

    forgot: { email: '' },
    forgotTouched: { email: false },
    forgotErrors: {},

    validateLogin() {
        this.loginErrors = {};
        if (!this.login.email) this.loginErrors.email = 'Email wajib diisi';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.login.email)) this.loginErrors.email = 'Format email tidak valid';
        if (!this.login.password) this.loginErrors.password = 'Password wajib diisi';
        return Object.keys(this.loginErrors).length === 0;
    },

    submitLogin() {
        this.loginTouched.email = true;
        this.loginTouched.password = true;
        if (this.validateLogin()) {
            alert('Proses Login...');
        }
    },

    validateRegister() {
        this.registerErrors = {};
        if (!this.register.name) this.registerErrors.name = 'Nama lengkap wajib diisi';
        if (!this.register.email) this.registerErrors.email = 'Email aktif wajib diisi';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.register.email)) this.registerErrors.email = 'Format email tidak valid';
        if (!this.register.password) this.registerErrors.password = 'Password wajib diisi';
        else if (this.register.password.length < 8) this.registerErrors.password = 'Password minimal 8 karakter';
        return Object.keys(this.registerErrors).length === 0;
    },

    submitRegister() {
        this.registerTouched.name = true;
        this.registerTouched.email = true;
        this.registerTouched.password = true;
        if (this.validateRegister()) {
            alert('Proses Pendaftaran...');
        }
    },

    validateForgot() {
        this.forgotErrors = {};
        if (!this.forgot.email) this.forgotErrors.email = 'Email wajib diisi';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.forgot.email)) this.forgotErrors.email = 'Format email tidak valid';
        return Object.keys(this.forgotErrors).length === 0;
    },

    submitForgot() {
        this.forgotTouched.email = true;
        if (this.validateForgot()) {
            alert('Mengirim Link Reset Password...');
        }
    }
}">
    
    <!-- Split Screen Layout -->
    <div class="flex flex-col md:flex-row min-h-screen">
        
        <!-- ========================================= -->
        <!-- LEFT PANEL: BRANDING & IMAGE (Desktop Only) -->
        <!-- ========================================= -->
        <div class="hidden md:flex md:w-1/2 lg:w-1/2 relative bg-brand-950 overflow-hidden flex-col justify-between p-10 lg:p-20 xl:p-24">
            
            <!-- Background Image & Overlay -->
            <div class="absolute inset-0 z-0">
                <img src="https://images.unsplash.com/photo-1573164713988-8665fc963095?q=80&w=2069&auto=format&fit=crop" alt="Background" class="w-full h-full object-cover opacity-30 mix-blend-overlay">
                <div class="absolute inset-0 bg-gradient-to-br from-brand-950/95 via-brand-900/90 to-brand-800/80"></div>
                <div class="absolute inset-0 bg-texture-dots opacity-40"></div>
            </div>
            
            <!-- Top Content -->
            <div class="relative z-10">
                <a href="index.html" class="inline-flex items-center gap-2 text-white/80 hover:text-white transition-all duration-300 ease-in-out group bg-white/5 hover:bg-white/10 px-5 py-2.5 rounded-full backdrop-blur-md border border-white/10 shadow-lg w-fit mb-24 lg:mb-32">
                    <i class="ph-bold ph-arrow-left group-hover:-translate-x-1 transition-transform duration-300 ease-in-out"></i>
                    <span class="text-sm font-semibold tracking-wide">Kembali ke Beranda</span>
                </a>
                
                <div class="w-20 h-20 bg-white rounded-2xl p-3 shadow-2xl mb-8 transform transition hover:scale-105">
                    <img src="https://gradasi.org/uploads/img/logo/1737187847.png" alt="Logo GRADASI" class="w-full h-full object-contain">
                </div>
                
                <h1 class="font-heading text-4xl lg:text-5xl xl:text-6xl font-extrabold text-white leading-tight mb-5 tracking-tight">
                    Kembangkan<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-amber-500">Potensi Digital</span> Anda
                </h1>
                
                <p class="text-lg text-brand-100/80 max-w-md font-light leading-relaxed">
                    Bergabung bersama ribuan pemuda Indonesia lainnya dalam membangun ekosistem digital yang kuat, mandiri, dan inovatif untuk kemajuan bangsa.
                </p>
            </div>
            
            <!-- Bottom Content -->
            <div class="relative z-10 flex items-center justify-between mt-12">
                <p class="text-white/40 text-sm font-medium">
                    &copy; 2026 DPP GRADASI.
                </p>
                <div class="flex gap-4">
                    <a href="https://www.facebook.com/gradasiofficial.id" target="_blank" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-white/20 hover:border-white/30 transition backdrop-blur-sm"><i class="ph-fill ph-facebook-logo text-lg"></i></a>
                    <a href="https://www.instagram.com/dppgradasi" target="_blank" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-white/20 hover:border-white/30 transition backdrop-blur-sm"><i class="ph-fill ph-instagram-logo text-lg"></i></a>
                    <a href="https://www.youtube.com/channel/UCwdjB4LkqcF4Kw5-PoyOb5A" target="_blank" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-white/20 hover:border-white/30 transition backdrop-blur-sm"><i class="ph-fill ph-youtube-logo text-lg"></i></a>
                </div>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- RIGHT PANEL: FORMS -->
        <!-- ========================================= -->
        <div class="w-full md:w-1/2 lg:w-1/2 min-h-screen flex items-center justify-center p-6 sm:p-12 lg:p-16 bg-white relative shadow-[-10px_0_30px_-15px_rgba(0,0,0,0.1)] z-10">
            
            <!-- Mobile Back Button (Only visible on small screens) -->
            <a href="index.html" class="md:hidden absolute top-6 left-6 inline-flex items-center gap-2 text-slate-500 hover:text-brand-600 transition group text-sm font-semibold bg-slate-50 px-4 py-2 rounded-full border border-slate-200 shadow-sm">
                <i class="ph-bold ph-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                Beranda
            </a>

            <!-- Form Container -->
            <div class="w-full max-w-md mt-12 md:mt-0">
                
                <!-- Dynamic Header -->
                <div class="mb-10 text-center md:text-left">
                    <!-- Mobile Logo -->
                    <div class="md:hidden inline-flex w-16 h-16 bg-white rounded-xl p-2 shadow-lg mb-6 border border-slate-100">
                        <img src="https://gradasi.org/uploads/img/logo/1737187847.png" alt="Logo" class="w-full h-full object-contain">
                    </div>
                    
                    <h2 class="font-heading text-3xl font-extrabold text-slate-900 mb-2 tracking-tight" x-text="view === 'login' ? 'Selamat Datang' : (view === 'register' ? 'Buat Akun Baru' : 'Lupa Password')"></h2>
                    <p class="text-slate-500 text-sm font-medium" x-text="view === 'login' ? 'Silakan masuk dengan email terdaftar Anda.' : (view === 'register' ? 'Isi formulir di bawah ini untuk mendaftar.' : 'Masukkan email terdaftar untuk reset password.')"></p>
                </div>

                <!-- 
                    Smooth Transition Wrapper 
                    - relative position to act as anchor
                    - fixed min-height to prevent jumping when children swap
                -->
                <div class="relative min-h-[380px] w-full">
                    
                    <!-- ================= LOGIN FORM ================= -->
                    <form x-show="view === 'login'" 
                        @submit.prevent="submitLogin()"
                        x-transition:enter="transition ease-out duration-500"
                        x-transition:enter-start="opacity-0 translate-x-8"
                        x-transition:enter-end="opacity-100 translate-x-0"
                        x-transition:leave="transition ease-in duration-300"
                        x-transition:leave-start="opacity-100 translate-x-0"
                        x-transition:leave-end="opacity-0 -translate-x-8"
                        class="absolute inset-0 w-full flex flex-col gap-5">
                        
                        <!-- Email Input -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Email Akses</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none transition-colors"
                                    :class="(loginTouched.email && loginErrors.email) ? 'text-red-400' : 'text-slate-400 group-focus-within:text-brand-600'">
                                    <i class="ph-bold ph-envelope-simple text-lg"></i>
                                </div>
                                <input type="email" x-model="login.email" @input="validateLogin()" @blur="loginTouched.email = true; validateLogin()" placeholder="nama@email.com" 
                                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border rounded-xl focus:outline-none focus:bg-white transition-all text-sm font-medium shadow-sm group-hover:border-slate-300"
                                    :class="(loginTouched.email && loginErrors.email) ? 'border-red-400 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-red-900 placeholder-red-300' : 'border-slate-200 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-700 placeholder-slate-400'">
                            </div>
                            <p x-show="loginTouched.email && loginErrors.email" x-text="loginErrors.email" x-transition class="text-red-500 text-[11px] font-bold mt-1.5 ml-1"></p>
                        </div>

                        <!-- Password Input -->
                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label class="block text-sm font-bold text-slate-700">Password</label>
                                <button type="button" @click="view = 'forgot'; forgotTouched = {email: false}; forgotErrors = {};" class="text-[11px] font-bold text-brand-600 hover:text-brand-800 transition uppercase tracking-wider">Lupa Password?</button>
                            </div>
                            <div class="relative group" x-data="{ show: false }">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none transition-colors"
                                    :class="(loginTouched.password && loginErrors.password) ? 'text-red-400' : 'text-slate-400 group-focus-within:text-brand-600'">
                                    <i class="ph-bold ph-lock-key text-lg"></i>
                                </div>
                                <input :type="show ? 'text' : 'password'" x-model="login.password" @input="validateLogin()" @blur="loginTouched.password = true; validateLogin()" placeholder="••••••••" 
                                    class="w-full pl-11 pr-12 py-3 bg-slate-50 border rounded-xl focus:outline-none focus:bg-white transition-all text-sm font-medium shadow-sm group-hover:border-slate-300"
                                    :class="(loginTouched.password && loginErrors.password) ? 'border-red-400 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-red-900 placeholder-red-300' : 'border-slate-200 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-700 placeholder-slate-400'">
                                <button type="button" @click="show = !show" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-brand-600 transition-colors">
                                    <i class="ph-bold text-lg" :class="show ? 'ph-eye-slash' : 'ph-eye'"></i>
                                </button>
                            </div>
                            <p x-show="loginTouched.password && loginErrors.password" x-text="loginErrors.password" x-transition class="text-red-500 text-[11px] font-bold mt-1.5 ml-1"></p>
                        </div>

                        <!-- Login Button (Modernized) -->
                        <button type="submit" class="group relative overflow-hidden bg-brand-600 hover:bg-brand-700 text-white w-full py-3.5 rounded-xl text-sm font-bold transition-all duration-300 shadow-sm hover:shadow-md transform hover:-translate-y-0.5 mt-2 flex items-center justify-center gap-2">
                            <span>Masuk</span>
                            <i class="ph-bold ph-arrow-right transition-transform duration-300 group-hover:translate-x-1"></i>
                        </button>
                        
                        <!-- Toggle to Register -->
                        <div class="text-center md:text-left mt-2">
                            <p class="text-sm font-medium text-slate-500">
                                Belum terdaftar? 
                                <button type="button" @click="view = 'register'; registerTouched = {name: false, email: false, password: false}; registerErrors = {};" class="font-bold text-brand-600 hover:text-brand-800 transition border-b-2 border-transparent hover:border-brand-800 pb-0.5 ml-1">
                                    Daftar sekarang
                                </button>
                            </p>
                        </div>
                    </form>

                    <!-- ================= REGISTER FORM ================= -->
                    <form x-show="view === 'register'" 
                        style="display: none;"
                        @submit.prevent="submitRegister()"
                        x-transition:enter="transition ease-out duration-500 delay-100"
                        x-transition:enter-start="opacity-0 -translate-x-8"
                        x-transition:enter-end="opacity-100 translate-x-0"
                        x-transition:leave="transition ease-in duration-300"
                        x-transition:leave-start="opacity-100 translate-x-0"
                        x-transition:leave-end="opacity-0 translate-x-8"
                        class="absolute inset-0 w-full flex flex-col gap-4">
                        
                        <!-- Name Input -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Nama Lengkap</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none transition-colors"
                                    :class="(registerTouched.name && registerErrors.name) ? 'text-red-400' : 'text-slate-400 group-focus-within:text-brand-600'">
                                    <i class="ph-bold ph-user text-lg"></i>
                                </div>
                                <input type="text" x-model="register.name" @input="validateRegister()" @blur="registerTouched.name = true; validateRegister()" placeholder="Nama sesuai KTP" 
                                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border rounded-xl focus:outline-none focus:bg-white transition-all text-sm font-medium shadow-sm group-hover:border-slate-300"
                                    :class="(registerTouched.name && registerErrors.name) ? 'border-red-400 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-red-900 placeholder-red-300' : 'border-slate-200 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-700 placeholder-slate-400'">
                            </div>
                            <p x-show="registerTouched.name && registerErrors.name" x-text="registerErrors.name" x-transition class="text-red-500 text-[11px] font-bold mt-1.5 ml-1"></p>
                        </div>

                        <!-- Email Input -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Email Aktif</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none transition-colors"
                                    :class="(registerTouched.email && registerErrors.email) ? 'text-red-400' : 'text-slate-400 group-focus-within:text-brand-600'">
                                    <i class="ph-bold ph-envelope-simple text-lg"></i>
                                </div>
                                <input type="email" x-model="register.email" @input="validateRegister()" @blur="registerTouched.email = true; validateRegister()" placeholder="nama@email.com" 
                                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border rounded-xl focus:outline-none focus:bg-white transition-all text-sm font-medium shadow-sm group-hover:border-slate-300"
                                    :class="(registerTouched.email && registerErrors.email) ? 'border-red-400 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-red-900 placeholder-red-300' : 'border-slate-200 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-700 placeholder-slate-400'">
                            </div>
                            <p x-show="registerTouched.email && registerErrors.email" x-text="registerErrors.email" x-transition class="text-red-500 text-[11px] font-bold mt-1.5 ml-1"></p>
                        </div>

                        <!-- Password Input -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Buat Password</label>
                            <div class="relative group" x-data="{ show: false }">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none transition-colors"
                                    :class="(registerTouched.password && registerErrors.password) ? 'text-red-400' : 'text-slate-400 group-focus-within:text-brand-600'">
                                    <i class="ph-bold ph-lock-key text-lg"></i>
                                </div>
                                <input :type="show ? 'text' : 'password'" x-model="register.password" @input="validateRegister()" @blur="registerTouched.password = true; validateRegister()" placeholder="Minimal 8 karakter" 
                                    class="w-full pl-11 pr-12 py-3 bg-slate-50 border rounded-xl focus:outline-none focus:bg-white transition-all text-sm font-medium shadow-sm group-hover:border-slate-300"
                                    :class="(registerTouched.password && registerErrors.password) ? 'border-red-400 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-red-900 placeholder-red-300' : 'border-slate-200 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 text-slate-700 placeholder-slate-400'">
                                <button type="button" @click="show = !show" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-brand-600 transition-colors">
                                    <i class="ph-bold text-lg" :class="show ? 'ph-eye-slash' : 'ph-eye'"></i>
                                </button>
                            </div>
                            <p x-show="registerTouched.password && registerErrors.password" x-text="registerErrors.password" x-transition class="text-red-500 text-[11px] font-bold mt-1.5 ml-1"></p>
                        </div>

                        <!-- Register Button (Modernized) -->
                        <button type="submit" class="group relative overflow-hidden bg-brand-600 hover:bg-brand-700 text-white w-full py-3.5 rounded-xl text-sm font-bold transition-all duration-300 shadow-sm hover:shadow-md transform hover:-translate-y-0.5 mt-2 flex items-center justify-center gap-2">
                            <span>Daftar Sekarang</span>
                            <i class="ph-bold ph-check-circle transition-transform duration-300 group-hover:scale-110"></i>
                        </button>
                        
                        <!-- Toggle to Login -->
                        <div class="text-center md:text-left mt-2">
                            <p class="text-sm font-medium text-slate-500">
                                Sudah punya akun? 
                                <button type="button" @click="view = 'login'; loginTouched = {email: false, password: false}; loginErrors = {};" class="font-bold text-slate-900 hover:text-brand-600 transition border-b-2 border-transparent hover:border-brand-600 pb-0.5 ml-1">
                                    Masuk di sini
                                </button>
                            </p>
                        </div>
                    </form>

                    <!-- ================= FORGOT PASSWORD FORM ================= -->
                    <form x-show="view === 'forgot'" 
                        style="display: none;"
                        @submit.prevent="submitForgot()"
                        x-transition:enter="transition ease-out duration-500 delay-100"
                        x-transition:enter-start="opacity-0 translate-y-8"
                        x-transition:enter-end="opacity-100 translate-y-0"
                        x-transition:leave="transition ease-in duration-300"
                        x-transition:leave-start="opacity-100 translate-y-0"
                        x-transition:leave-end="opacity-0 -translate-y-8"
                        class="absolute inset-0 w-full flex flex-col gap-5">
                        
                        <!-- Email Input -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">Email Terdaftar</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none transition-colors"
                                    :class="(forgotTouched.email && forgotErrors.email) ? 'text-red-400' : 'text-slate-400 group-focus-within:text-amber-500'">
                                    <i class="ph-bold ph-envelope-simple text-lg"></i>
                                </div>
                                <input type="email" x-model="forgot.email" @input="validateForgot()" @blur="forgotTouched.email = true; validateForgot()" placeholder="nama@email.com" 
                                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border rounded-xl focus:outline-none focus:bg-white transition-all text-sm font-medium shadow-sm group-hover:border-slate-300"
                                    :class="(forgotTouched.email && forgotErrors.email) ? 'border-red-400 focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-red-900 placeholder-red-300' : 'border-slate-200 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 text-slate-700 placeholder-slate-400'">
                            </div>
                            <p x-show="forgotTouched.email && forgotErrors.email" x-text="forgotErrors.email" x-transition class="text-red-500 text-[11px] font-bold mt-1.5 ml-1"></p>
                        </div>

                        <!-- Reset Button -->
                        <button type="submit" class="group relative overflow-hidden bg-slate-800 hover:bg-slate-900 text-white w-full py-3.5 rounded-xl text-sm font-bold transition-all duration-300 shadow-sm hover:shadow-md transform hover:-translate-y-0.5 mt-2 flex items-center justify-center gap-2">
                            <span>Kirim Link Reset</span>
                            <i class="ph-bold ph-paper-plane-right transition-transform duration-300 group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                        </button>
                        
                        <!-- Toggle to Login -->
                        <div class="text-center md:text-left mt-2">
                            <button type="button" @click="view = 'login'; loginTouched = {email: false, password: false}; loginErrors = {};" class="text-sm font-bold text-slate-500 hover:text-brand-600 transition inline-flex items-center gap-1.5">
                                <i class="ph-bold ph-arrow-left"></i> Kembali ke Halaman Masuk
                            </button>
                        </div>
                    </form>

                </div> <!-- End Smooth Transition Wrapper -->

            </div>
        </div>
    </div>

</body>
</html>
